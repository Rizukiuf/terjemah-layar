name: Buat APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/TerjemahLayar.apk

      - name: Simpan APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TerjemahLayar-apk
          path: out/TerjemahLayar.apk

      - name: Terbitkan di halaman Releases (mudah diunduh dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Terjemah Layar (build ${{ github.run_number }})
          body: Unduh TerjemahLayar.apk di bawah ini, lalu buka file tersebut di HP untuk memasang.
          files: out/TerjemahLayar.apk
