name: Buat APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log; then
            # Ringkas inti error menjadi catatan (annotation) agar mudah dibaca
            MSG=$( { grep -E "error:|e: |ERROR:|AAPT|Could not|What went wrong" -A3 build.log | head -60; \
                     grep -A25 "What went wrong" build.log | head -40; } | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build gagal::${MSG}"
            exit 1
          fi
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/TerjemahLayar.apk

      - name: Terbitkan di halaman Releases (mudah diunduh dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/TerjemahLayar.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Terjemah Layar (build ${{ github.run_number }})" \
            --notes "Unduh TerjemahLayar.apk di bawah ini, lalu buka file tersebut di HP untuk memasang."
